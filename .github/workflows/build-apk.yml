{"jobs":{"build":{"env":{"KEYSTORE_BASE64":"${{ secrets.KEYSTORE_BASE64 }}","KEYSTORE_PASSWORD":"${{ secrets.KEYSTORE_PASSWORD }}","KEY_ALIAS":"${{ secrets.KEY_ALIAS }}","KEY_PASSWORD":"${{ secrets.KEY_PASSWORD }}"},"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"android-actions/setup-android@v3"},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Install Android SDK","run":"sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"},{"name":"Check project structure","run":"python3 tools/check_project.py"},{"name":"Require signing secrets","run":"set -euo pipefail\nfor key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do\n  if [[ -z \"${!key}\" ]]; then echo \"Missing required secret: $key\" >&2; exit 1; fi\ndone","shell":"bash"},{"name":"Test and build release","run":"gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease"},{"env":{"ALLOW_NEW_SIGNATURE":"${{ inputs.allow_new_signature }}"},"name":"Verify APK and certificate","run":"set -euo pipefail\nAPK=app/build/outputs/apk/release/app-release.apk\n\"$ANDROID_HOME/build-tools/35.0.0/apksigner\" verify --verbose --print-certs \"$APK\" | tee app/build/outputs/apk/release/signature.txt\nEXPECTED=52a51e0154dfe461798f73e207f14f67a4f8342599092a7efd7d0ffe44a4f81d\nACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/release/signature.txt | tr -d ': ' | tr '[:upper:]' '[:lower:]')\nif [[ \"$ACTUAL\" != \"$EXPECTED\" && \"$ALLOW_NEW_SIGNATURE\" != true ]]; then\n  echo 'Certificate differs from original. Explicitly allow a new signature only for a fresh install.' >&2; exit 1\nfi\nif [[ \"$ACTUAL\" != \"$EXPECTED\" ]]; then echo 'WARNING: This APK cannot update the original installation.'; fi\nsha256sum \"$APK\" > app/build/outputs/apk/release/SHA256SUMS.txt","shell":"bash"},{"name":"Upload signed APK","uses":"actions/upload-artifact@v4","with":{"if-no-files-found":"error","name":"calculator-1.1.0-signed","path":"app/build/outputs/apk/release/","retention-days":14}},{"if":"always()","name":"Upload test reports","uses":"actions/upload-artifact@v4","with":{"if-no-files-found":"ignore","name":"calculator-test-reports","path":"app/build/reports/tests/\napp/build/test-results/","retention-days":14}}],"timeout-minutes":25}},"name":"Build signed calculator APK","on":{"workflow_dispatch":{"inputs":{"allow_new_signature":{"default":false,"description":"Allow a different certificate (cannot update the original APK)","required":true,"type":"boolean"}}}},"permissions":{"contents":"read"}}